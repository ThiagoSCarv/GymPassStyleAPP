name: E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: solidnode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/solidnode_test

      - name: Run E2E tests
        run: pnpm vitest run src/http/ src/repositories/prisma/
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-ci
          DATABASE_URL: postgresql://user:password@localhost:5432/solidnode_test
